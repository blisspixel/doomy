[package]
name = "fragr-playtest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Scripted agents play fragr rounds in-process and file a metrics report"
publish = false

[lib]
name = "fragr_playtest"
path = "src/lib.rs"

[[bin]]
name = "fragr-playtest"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
fragr-server = { path = "../../server", version = "0.1.0" }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.26", features = ["v4", "serde"] }

[lints]
workspace = true
