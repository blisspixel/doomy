[package]
name = "fragr-brain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Example fragr agent: a remote decision brain (TypeSafe Jev natively or through OpenRouter) sets intent a few times a second, a local controller plays every tick, and a hard spend cap sits in front of every paid call"
publish = false

[lib]
name = "fragr_brain"
path = "src/lib.rs"

[[bin]]
name = "fragr-brain"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
fragr-server = { path = "../../server", version = "0.1.0" }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.26", features = ["v4", "serde"] }

[lints]
workspace = true
